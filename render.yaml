databases:
  - name: campus-events-db
    databaseName: campus_events
    plan: free

services:
  - type: web
    name: campus-events-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DB_URL
        fromDatabase:
          name: campus-events-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ADMIN_CODE
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
